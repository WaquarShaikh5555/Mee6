name: Deploy API

# One-tap deployment from GitHub's runners — no local terminal, no PC, and no
# long-lived Azure credential stored anywhere. Authentication uses OIDC
# federation, set up once with `infra/bootstrap-oidc.sh`.
#
# Run it from the GitHub mobile app: Actions → Deploy API → Run workflow.

on:
  workflow_dispatch:

permissions:
  id-token: write # required to request the OIDC token that Azure exchanges
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable AZURE_${name} is not set. See docs/BACKEND.md → One-tap redeploys."
              missing=1
            fi
          done
          if [ -z "${{ secrets.DB_ADMIN_PASSWORD }}" ]; then
            echo "::error::Repository secret DB_ADMIN_PASSWORD is not set."
            missing=1
          fi
          exit "$missing"

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'shaikhs-prod' }}
          LOCATION: ${{ vars.AZURE_LOCATION || 'centralindia' }}
          PREFIX: ${{ vars.AZURE_PREFIX || 'shaikhs' }}
          ACS_DATA_LOCATION: ${{ vars.AZURE_ACS_DATA_LOCATION || 'Asia Pacific' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
        run: ./infra/deploy.sh
