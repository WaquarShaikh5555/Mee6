apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'expo.modules.rewarded'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.rewarded"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"

    // Applied to whoever includes this module, i.e. the app. `defaultConfig`
    // is where AGP defines this — at the `android` level it fails the build.
    consumerProguardFiles "consumer-rules.pro"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  lintOptions {
    abortOnError false
  }

}

dependencies {
  // The artifact Google publishes, used directly. No React Native wrapper in
  // between means no Fabric component, no TurboModule and nothing registered
  // at import time — the three things that closed this app on launch.
  implementation "com.google.android.gms:play-services-ads:25.5.0"
}
