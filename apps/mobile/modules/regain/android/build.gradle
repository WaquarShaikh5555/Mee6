apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'expo.modules.regain'
version = '0.1.0'

// The helpers Expo's own modules use: Kotlin version, project wiring, and the
// "depend on expo-modules-core" shortcut. Reusing them keeps this module on the
// same toolchain as the rest of the app.
def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Same compileSdk / minSdk / targetSdk as the app, so nothing drifts.
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.regain"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  lintOptions {
    abortOnError false
  }
}
