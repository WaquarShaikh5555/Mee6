apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'expo.modules.pdfarena'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.pdfarena"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // The release build is minified; these rules travel with the module.
    consumerProguardFiles "consumer-rules.pro"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  packagingOptions {
    resources {
      excludes += ["META-INF/*.kotlin_module", "META-INF/*.version", "META-INF/proguard/*"]
    }
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Apache-2.0. The same library PaperKnife+ builds on; the code here is our own.
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
